<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HEMS Mobile Prototype</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="page-shell">
      <section class="intro">
        <p class="eyebrow">Prototype</p>
        <h1>Home Expense Management App</h1>
        <p>
          A clickable mobile prototype for tracking expenses before you pay with
          GPay, BHIM, PhonePe, or another UPI app.
        </p>
        <ol class="flow-list">
          <li>Select category</li>
          <li>Scan QR or enter UPI ID</li>
          <li>Confirm amount</li>
          <li>Choose payment app</li>
          <li>Return and save transaction</li>
        </ol>
      </section>

      <section class="phone" aria-label="HEMS mobile app prototype">
        <div class="phone-status">
          <span>9:41</span>
          <span>HEMS</span>
          <span>100%</span>
        </div>

        <div id="app" class="screen"></div>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
